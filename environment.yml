name: wirewalker
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - matplotlib
  - xarray
  - netcdf4
  - gsw
  - cmocean
  - ipykernel
  - jupyterlab
  - pip
  - pip:
      - plotly       # interactive notebook plots
      - ipywidgets   # slider/dropdown controls in the exploration notebooks
      - anywidget    # required by plotly >= 6 for go.FigureWidget
      - nbstripout   # strips notebook outputs on commit
      - mhkit        # read raw Nortek .ad2cp ADCP files: `from mhkit import dolfyn`
                     # (maintained successor to the standalone dolfyn; supports numpy 2 / scipy 1.18)
      # NOTE: the RBR thermal-mass correction (correct_thermal_mass) is reimplemented
      # in-house; its coefficients match RBR pyRSKtools RSK.correctTM (cited in the
      # docstring). pyRSKtools is NOT a dependency -- it capped numpy<=1.26 and is unused.
